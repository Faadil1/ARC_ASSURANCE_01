[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./build/out" }]

[profile.arc]
network = "arc"

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
