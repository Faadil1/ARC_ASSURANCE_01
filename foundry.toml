[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
