name: V2 FAIL1 commitBatch Receipt

on:
  push:
    branches:
      - ops/v2-live-depth-fail-breaker-readiness
    paths:
      - ".github/v2-fail1-commit-receipt-request"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: |
          forge install foundry-rs/forge-std@v1.16.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge build
      - run: node script/v2_fail1_verify_commit_receipt.mjs https://rpc.mainnet.arc.io out/AssuranceVault.sol/AssuranceVault.json
