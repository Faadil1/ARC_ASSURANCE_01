name: T0 Policy Registration Receipt

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io
      T0_CONTRACT_ADDRESS: "0x0377D371d6981c98CE9C650338D7E1E80819B572"
      T0_POLICY_ID: "0x4152435f4153535552414e43455f30313a54303a504f4c4943593a3100000000"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify createPolicy transaction receipt
        run: |
          python3 -m py_compile script/t0_verify_policy_registration_receipt.py
          python3 script/t0_verify_policy_registration_receipt.py \
            "$ARC_MAINNET_RPC_URL" \
            ops/t0-policy-registration-receipt-input.json \
            | tee t0-policy-registration-receipt.json

      - name: Install Arc Foundry tools
        run: |
          set -euo pipefail
          ARC_TAG="v0.8.0-2"
          ARC_VER="${ARC_TAG#v}"
          ASSET="arc-foundry-v${ARC_VER}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/circlefin/arc-foundry/releases/download/${ARC_TAG}/${ASSET}"
          EXPECTED_SHA256="088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556"

          curl -fsSL "$URL" -o /tmp/arc.tar.gz
          ACTUAL_SHA256="$(sha256sum /tmp/arc.tar.gz | awk '{print $1}')"
          [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]

          rm -rf /tmp/arcbin && mkdir -p /tmp/arcbin
          tar -xzf /tmp/arc.tar.gz -C /tmp/arcbin
          for b in /tmp/arcbin/*; do
            [ -f "$b" ] && [ -x "$b" ] && sudo install -m 0755 "$b" "/usr/local/bin/$(basename "$b")"
          done
          printf '#!/bin/sh\nexec cast "$@"\n' | sudo tee /usr/local/bin/arc-cast >/dev/null
          sudo chmod 0755 /usr/local/bin/arc-cast
          arc-cast --version

      - name: Verify function selector and post-registration state
        run: |
          set -euo pipefail
          EXPECTED_SELECTOR="$(arc-cast sig 'createPolicy(bytes32,address,address,uint256,uint256,uint64)')"
          ACTUAL_SELECTOR="$(python3 - <<'PY'
          import json
          with open("t0-policy-registration-receipt.json", "r", encoding="utf-8") as f:
              print(json.load(f)["function_selector"])
          PY
          )"
          [ "${ACTUAL_SELECTOR,,}" = "${EXPECTED_SELECTOR,,}" ]

          POLICY_COUNT="$(arc-cast call "$T0_CONTRACT_ADDRESS" "policyCount()(uint256)" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          EXISTS="$(arc-cast call "$T0_CONTRACT_ADDRESS" "policyExists(bytes32)(bool)" "$T0_POLICY_ID" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          STATE="$(arc-cast call "$T0_CONTRACT_ADDRESS" "stateOf(bytes32)(uint8)" "$T0_POLICY_ID" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          REMAINING="$(arc-cast call "$T0_CONTRACT_ADDRESS" "remainingFor(bytes32)(uint256)" "$T0_POLICY_ID" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          LIABILITY="$(arc-cast call "$T0_CONTRACT_ADDRESS" "totalLiability()(uint256)" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          RECEIVED="$(arc-cast call "$T0_CONTRACT_ADDRESS" "totalCustodyReceived()(uint256)" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"
          RELEASED="$(arc-cast call "$T0_CONTRACT_ADDRESS" "totalValueReleased()(uint256)" --rpc-url "$ARC_MAINNET_RPC_URL" | awk '{print $1}')"

          [ "$POLICY_COUNT" = "1" ]
          [ "$EXISTS" = "true" ]
          # STATE / REMAINING / LIABILITY / RECEIVED / RELEASED are lifecycle-mutable.
          # Registration proof is historical and must remain valid after later
          # authorized funding / payout / refund / completion transitions.

          GET_POLICY="$(arc-cast call "$T0_CONTRACT_ADDRESS" "getPolicy(bytes32)((bytes32,address,address,uint256,uint256,uint64,uint64,uint64,uint64,uint256,uint256,uint256,bool,bool,uint8))" "$T0_POLICY_ID" --rpc-url "$ARC_MAINNET_RPC_URL")"

          cat > t0-policy-registration-state.json <<EOF
          {
            "schema": "ARC_ASSURANCE_T0_POLICY_REGISTRATION_STATE_V1",
            "contract_address": "$T0_CONTRACT_ADDRESS",
            "policy_id": "$T0_POLICY_ID",
            "function_selector": "$ACTUAL_SELECTOR",
            "policy_count": "$POLICY_COUNT",
            "policy_exists": "$EXISTS",
            "current_state": "$STATE",
            "current_remaining": "$REMAINING",
            "current_total_liability": "$LIABILITY",
            "current_total_custody_received": "$RECEIVED",
            "current_total_value_released": "$RELEASED",
            "get_policy_raw": $(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$GET_POLICY"),
            "verified": true
          }
          EOF

      - name: Upload policy registration evidence
        uses: actions/upload-artifact@v5
        with:
          name: t0-policy-registration-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            t0-policy-registration-receipt.json
            t0-policy-registration-state.json
          if-no-files-found: error
          retention-days: 90
