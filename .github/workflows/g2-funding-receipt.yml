name: G2 Funding Receipt

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned Solidity libraries
        run: |
          forge install foundry-rs/forge-std@v1.16.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git

      - name: Build exact artifact
        run: forge build

      - name: Verify real Arc funding receipt
        run: |
          mkdir -p build
          node script/g2_verify_funding_receipt.mjs             "$ARC_MAINNET_RPC_URL"             ops/g2-funding-receipt-input.json             out/AssuranceVault.sol/AssuranceVault.json             | tee build/g2-funding-receipt.json

      - name: Upload funding evidence
        uses: actions/upload-artifact@v5
        with:
          name: g2-funding-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ops/g2-funding-receipt-input.json
            build/g2-funding-receipt.json
            out/AssuranceVault.sol/AssuranceVault.json
          if-no-files-found: error
          retention-days: 90
