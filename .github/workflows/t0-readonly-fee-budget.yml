name: T0 Read-Only Fee Budget

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io
      T0_PUBLIC_WALLET_ADDRESS: 0x2ca7ba27ab8686F3a073c053FaD6258C003a02bb

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run deterministic budget tests
        run: |
          python3 test/test_t0_readonly_fee_budget.py
          python3 test/test_t0_funding_envelope.py

      - name: Inspect dedicated public wallet
        run: |
          python3 script/t0_public_wallet_readiness.py \
            "$ARC_MAINNET_RPC_URL" \
            "$T0_PUBLIC_WALLET_ADDRESS" \
            | tee t0-public-wallet-readiness.json

      - name: Capture Arc read-only fee budget
        run: |
          python3 script/t0_readonly_fee_budget.py \
            ops/t0-fee-budget-input.json \
            t0-fee-budget-snapshot.json

      - name: Validate candidate funding envelope
        run: |
          python3 script/validate_t0_funding_envelope.py \
            ops/t0-funding-envelope.json \
            t0-fee-budget-snapshot.json \
            t0-funding-envelope-validation.json

      - name: Upload snapshot
        uses: actions/upload-artifact@v5
        with:
          name: t0-funding-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            t0-public-wallet-readiness.json
            t0-fee-budget-snapshot.json
            t0-funding-envelope-validation.json
          if-no-files-found: error
          retention-days: 30
