name: V2 Live Depth FAIL-BREAKER Readiness

on:
  push:
    branches:
      - ops/v2-live-depth-fail-breaker-readiness
    paths:
      - ".github/v2-live-depth-fail-breaker-readiness-request"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: |
          forge install foundry-rs/forge-std@v1.16.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge build
      - name: Prove negative/breaker/refund semantics on exact source
        run: |
          forge test -vv --match-test 'test_(FAIL_WithholdsAndCannotLaterPaySameBatch|SecondFAIL_TriggersBreakerAndRefundsProtectedRemainder|PASS_ThenBreaker_RefundsOnlyRemainingLiability)'
      - name: Check live v2 readiness without broadcasting
        run: node script/v2_live_depth_fail_breaker_readiness.mjs https://rpc.mainnet.arc.io out/AssuranceVault.sol/AssuranceVault.json
