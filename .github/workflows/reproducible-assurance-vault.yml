name: Reproducible AssuranceVault Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "script/**"
      - "build/**"
      - "foundry.toml"
      - "remappings.txt"
      - "package.json"
      - ".github/workflows/reproducible-assurance-vault.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-assurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"

      - name: Cache Cargo and Arc Foundry build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tooling/arc-foundry-target
          key: arc-foundry-d497beea7096ff2a8e583c8b307941f24a61b06b-${{ runner.os }}-${{ runner.arch }}

      - name: Run full reproducible gate
        shell: bash
        run: |
          bash script/run-reproducible-gate.sh

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-vault-reproducible-proof-${{ github.sha }}
          path: build/out/
          if-no-files-found: error
          retention-days: 30
