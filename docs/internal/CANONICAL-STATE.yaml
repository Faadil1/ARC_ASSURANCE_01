t0_mainnet_custody:
  branch: feat/t0-mainnet-custody
  status: CODE_READY_CANDIDATE
  evidence_class: NOT_IMPLEMENTED
  implementation:
    contract: src/PolicyCustody.sol
    tests: test/PolicyCustody.t.sol
    deploy_script: script/DeployT0.s.sol
    proof_driver: script/t0-mainnet-proof.sh
    runbook: docs/T0-MAINNET-RUNBOOK.md
    evidence_template: docs/evidence/T0-MAINNET-CUSTODY.md
  supersedes:
    removed:
      - src/T0NativeCustody.sol
      - test/T0NativeCustody.t.sol
    reason: >-
      The initial spike allowed a caller-supplied payout recipient and
      refunded from the pooled contract balance. PolicyCustody makes the
      payout recipient immutable, bounds payout and refund to the individual
      policy's own liability, and forbids refund before the configured payout.
    note: "No mainnet deployment existed for the removed spike, so nothing is lost."
  design_change:
    from: "ERC-20 approve/transferFrom custody assumption"
    to: "Arc-native USDC msg.value custody/payout/refund"
    reason: "Arc uses USDC as the native gas/value; T0 should minimize non-load-bearing dependencies."
