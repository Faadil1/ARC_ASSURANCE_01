promoted_invariants:
  - id: INV-01
    rule: "The canary commitment must exist before provider output lock."
  - id: INV-02
    rule: "The provider must not know which work item is the canary before output commitment."
  - id: INV-03
    rule: "MVP PASS/FAIL is deterministic and does not use an LLM as primary judge."
  - id: INV-04
    rule: "Provider output must be cryptographically bound before canary reveal."
  - id: INV-05
    rule: "PASS/FAIL must have a real USDC financial consequence."
  - id: INV-06
    rule: "Configured repeated failures must be able to trigger a circuit breaker."
  - id: INV-07
    rule: "Revealed canaries are never reused as hidden canaries."
  - id: INV-08
    rule: "LOCAL_STUB/testnet/simulated payment evidence is never narrated as LIVE_MAINNET."
  - id: INV-09
    rule: "Claims remain bounded to what chain state and deterministic verification actually prove."
  - id: INV-10
    rule: "A clean third-party verification path is required before promotion."

