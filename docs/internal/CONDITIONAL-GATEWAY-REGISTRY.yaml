registry_rules:
  - "Every canonical gate must appear explicitly; omission is not a status."
  - "N/A means evaluated and not applicable, never forgotten."
  - "BLOCKED means a prerequisite/evidence gap prevents promotion."
  - "PROVEN requires an evidence reference or a durable repository artifact."
  - "Re-evaluate the full registry on any material scope, architecture, runtime, sponsor, or submission change."
  - "LOCAL_STUB, SIMULATED, replay/static evidence, or testnet evidence cannot be promoted to LIVE_GATEWAY."
  - "Technical Proof does not equal Live Product Integration."
  - "A vertical slice is an entry point, never Definition of Done."

